name: Release OpenAI plugin archive

# Tagging <version> (e.g. 1.2.0) builds the skills-only ZIP for the OpenAI plugin directory
# and attaches it to the GitHub release. Claude Code keeps versioning by commit;
# this tag only drives the OpenAI submission.
on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  archive:
    name: Build and attach the directory ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check the tag matches the manifest version
        run: |
          VERSION="$(node -p "require('./.codex-plugin/plugin.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match .codex-plugin/plugin.json version $VERSION" >&2
            exit 1
          fi

      - name: Build the archive
        run: scripts/openai/build-archive.sh

      - name: Attach it to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
